[project]
name = "chess-personality"
version = "0.1.0"
description = "A chess stylometry system that analyzes playing styles and matches players to historical chess masters."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.3.3",
    "python-chess>=1.999",
    "python-multipart>=0.0.32",
    "torch>=2.13.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "ipython>=9.5.0",
    "pytest>=9.1.1",
]
